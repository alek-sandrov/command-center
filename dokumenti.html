<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Документи - sofia-prepping.com</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">sofia-prepping.com</div>
            <div class="nav-links">
                <a href="index.html" class="nav-link">Начало</a>
                <a href="karti.html" class="nav-link">Карти</a>
                <a href="dokumenti.html" class="nav-link active">Документи</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <header>
            <h1>📄 Документи</h1>
        </header>

        <div class="grid">
            <!-- Emergency Protection Plans -->
            <section class="card full-width">
                <h2>📋 Планове за защита на населението на Столична Община</h2>

                <div class="map-gallery">
                    <div class="map-item" onclick="openModal('1UCxnFrJ6XVQ-G_66tDkIxjRvg8x6zrz7', 'СО - План за защита при наводнения')">
                        <img src="https://drive.google.com/thumbnail?id=1UCxnFrJ6XVQ-G_66tDkIxjRvg8x6zrz7&sz=w800" alt="СО - План за защита при наводнения" onerror="this.src='https://via.placeholder.com/400x300?text=План+наводнения'">
                        <div class="map-label">СО - План за защита при наводнения</div>
                    </div>

                    <div class="map-item" onclick="openModal('18iNPnkJFkCLJWy5S8BcyA_5l3zJt6Wmw', 'СО - План за защита при земетресения')">
                        <img src="https://drive.google.com/thumbnail?id=18iNPnkJFkCLJWy5S8BcyA_5l3zJt6Wmw&sz=w800" alt="СО - План за защита при земетресения" onerror="this.src='https://via.placeholder.com/400x300?text=План+земетресения'">
                        <div class="map-label">СО - План за защита при земетресения</div>
                    </div>

                    <div class="map-item" onclick="openModal('1FnqDX6fUQX0YI2O7hl9hC6x2FzA-RrI3', 'СО - План за защита при ядрени и радиационни заплахи')">
                        <img src="https://drive.google.com/thumbnail?id=1FnqDX6fUQX0YI2O7hl9hC6x2FzA-RrI3&sz=w800" alt="СО - План за защита при ядрени и радиационни заплахи" onerror="this.src='https://via.placeholder.com/400x300?text=План+радиация'">
                        <div class="map-label">СО - План за защита при ядрени и радиационни заплахи</div>
                    </div>
                </div>
            </section>
        </div>

        <footer>
            <p>sofia-prepping.com - София</p>
        </footer>
    </div>

    <!-- Modal for full-size image viewing -->
    <div id="imageModal" class="modal" onclick="closeModal()">
        <span class="modal-close">&times;</span>
        <div class="modal-content-wrapper">
            <img class="modal-content" id="modalImage" style="display: none;">
            <div class="modal-caption" id="modalCaption"></div>
        </div>
        <div class="modal-nav">
            <button class="modal-nav-btn" onclick="event.stopPropagation(); viewInDrive()">👁️ Виж в Drive</button>
            <button class="modal-nav-btn" onclick="event.stopPropagation(); downloadImage()">⬇️ Изтегли</button>
        </div>
    </div>

    <script src="dokumenti.js"></script>
</body>
</html>
