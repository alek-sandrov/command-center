name: Archive live status

# Every 30 minutes: read the live city status from the site and add what changed to the
# archive (scripts/archive_status.py). The archive lives on its own branch, "arhiv", so these
# commits never touch the site's code; "[CF-Pages-Skip]" stops Cloudflare Pages building them.
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# Runs never overlap, so two of them can't write the archive at once
concurrency:
  group: archive-status
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions pinned to exact commits (v4.4.0, v5.6.0) so a moved tag can't change what runs here
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Open the archive branch (created on the first run)
        run: |
          if git fetch --depth=1 origin arhiv; then
            git worktree add -B arhiv arhiv FETCH_HEAD
          else
            git worktree add --orphan -b arhiv arhiv
          fi
      - name: Archive
        run: python3 scripts/archive_status.py arhiv
      - name: Commit
        working-directory: arhiv
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -q -m "[CF-Pages-Skip] Archive $(TZ=Europe/Sofia date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do
            git push origin HEAD:arhiv && exit 0
            sleep 5
            git pull --rebase origin arhiv
          done
          exit 1
