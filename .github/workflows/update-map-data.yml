name: Update map data

on:
  schedule:
    - cron: '17 4 * * 1'  # every Monday 04:17 UTC
  workflow_dispatch:
    inputs:
      accept_big_changes:
        description: 'Publish layers that changed a lot since last week (only after checking the source maps)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to exact commits (v4.4.0, v5.6.0) so a moved tag can't change what runs here
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Build data/karta.json
        id: build
        env:
          ACCEPT_BIG_CHANGES: ${{ inputs.accept_big_changes && '1' || '0' }}
        # Layers that look fine are still committed when another is held back; the last step then fails
        run: python3 scripts/build_karta.py || echo "status=$?" >> "$GITHUB_OUTPUT"
      - name: Build data/analizi.json (readiness index)
        # Recomputed from the new map points; on failure last week's index stays
        run: python3 scripts/build_analizi.py || echo "::warning::Readiness index not rebuilt"
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/karta.json data/analizi.json
          git diff --cached --quiet || (git commit -m "Update map data" && git push)
      - name: Fail if a layer was held back or every source failed
        if: steps.build.outputs.status != ''
        run: |
          echo "::error::Map build exited with ${{ steps.build.outputs.status }}. See the 'Build data/karta.json' log (HOLD / FAIL lines)."
          exit 1
