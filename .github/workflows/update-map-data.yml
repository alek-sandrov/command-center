name: Update map data

on:
  schedule:
    - cron: '17 4 * * 1'  # every Monday 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build data/karta.json
        run: python3 scripts/build_karta.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/karta.json
          git diff --cached --quiet || (git commit -m "Update map data" && git push)
